<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Produto - Nome da Peça</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .product-image {
        max-width: 100%;
        height: auto;
      }

      .price {
        font-size: 24px;
        color: #d32f2f;
        font-weight: bold;
      }

      .old-price {
        text-decoration: line-through;
        color: #999;
        font-size: 16px;
      }

      .out-of-stock {
        background-color: #e0e0e0;
        color: #666;
        cursor: not-allowed;
      }

      .color-box {
        width: 30px;
        height: 30px;
        display: inline-block;
        border: 1px solid #ccc;
        margin-right: 8px;
        cursor: pointer;
      }

      .color-box.selected {
        border: 2px solid #000;
      }

      .size-btn {
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <!-- Imagem do Produto -->
        <div class="col-md-6 text-center">
          <img
            src="{% static 'main_app/img/produto.jpg' %}"
            alt="Produto"
            class="product-image"
          />
        </div>

        <!-- Detalhes do Produto -->
        <div class="col-md-6">
          <h5 class="text-muted">Shorts Box Denim</h5>
          <h2 class="mb-3">R$219,90</h2>
          <p class="text-secondary">6x de R$36,65 sem juros</p>

          <!-- Tamanhos -->
          <div class="mb-3">
            <strong>Tamanho</strong><br />
            <button class="btn btn-outline-secondary size-btn">P</button>
            <button class="btn btn-outline-secondary size-btn">M</button>
            <button class="btn btn-outline-secondary size-btn">G</button>
            <button class="btn btn-outline-secondary size-btn">GG</button>
          </div>

          <!-- Cor -->
          <div class="mb-3">
            <strong>Cor</strong><br />
            <div class="color-box" style="background-color: #2f3d5c"></div>
            <span>Stone Blue</span>
          </div>

          <!-- Botão de Compra -->
          <button class="btn btn-secondary out-of-stock w-100 mt-3" disabled>
            ESGOTADO
          </button>

          <!-- Pagamento -->
          <!-- Botão clicável -->
          <button
            class="btn btn-link mt-3 text-muted p-0"
            onclick="toggleTabela()"
          >
            Abrir Tabela de medidas
          </button>

          <!-- Imagem escondida inicialmente -->
          <div id="tabelaMedidas" class="mt-3 d-none">
            <img
              src="{% static 'main_app/img/logo.png' %}"
              alt="Tabela de Medidas"
              class="img-fluid"
            />
          </div>
        </div>
      </div>
    </div>
    <!-- Script para mostrar/ocultar -->
<script>
  function toggleTabela() {
    const tabela = document.getElementById("tabelaMedidas");
    tabela.classList.toggle("d-none");
  }
</script>
  </body>
</html>
