{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
  .product-image {
    max-width: 100%;
    height: auto;
  }

  .price {
    font-size: 24px;
    color: #d32f2f;
    font-weight: bold;
  }

  .old-price {
    text-decoration: line-through;
    color: #999;
    font-size: 16px;
  }

  .out-of-stock {
    background-color: #e0e0e0;
    color: #666;
    cursor: not-allowed;
  }

  .color-box {
    width: 30px;
    height: 30px;
    display: inline-block;
    border: 1px solid #ccc;
    margin-right: 8px;
    cursor: pointer;
  }

  .color-box.selected {
    border: 2px solid #000;
  }

  .size-btn {
    margin: 5px;
  }

  .tabela-container {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s ease;
  }

  .tabela-container.active {
    max-height: 1000px;
  }
  .carousel-control-prev-icon,
.carousel-control-next-icon {
  background-image: none;
  background-color: transparent;
  width: 2rem;
  height: 2rem;
  border: 2px solid #000;
  border-radius: 50%;
  position: relative;
}

.carousel-control-prev-icon::after,
.carousel-control-next-icon::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0.4rem;
  height: 0.4rem;
  border-top: 2px solid black;
  border-left: 2px solid black;
  transform: translate(-50%, -50%) rotate(-45deg);
}

.carousel-control-next-icon::after {
  transform: translate(-50%, -50%) rotate(135deg);
}
</style>

<div class="container mt-5">
  <div class="row">
    <!-- Carrossel de Imagens do Produto -->
    <div class="col-md-6 text-center">
      <div id="carouselProduto" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="{% static 'main_app/img/produto1.jpg' %}" class="d-block w-100 product-image" alt="Imagem 1">
          </div>
          <div class="carousel-item">
            <img src="{% static 'main_app/img/produto2.jpg' %}" class="d-block w-100 product-image" alt="Imagem 2">
          </div>
          <div class="carousel-item">
            <img src="{% static 'main_app/img/produto3.jpg' %}" class="d-block w-100 product-image" alt="Imagem 3">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselProduto" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselProduto" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Próxima</span>
        </button>
      </div>
    </div>

    <!-- Detalhes do Produto -->
    <div class="col-md-6">
      <h5 class="text-muted">Shorts Box Denim</h5>
      <h2 class="mb-3">R$219,90</h2>
      <p class="text-secondary">6x de R$36,65 sem juros</p>

      <!-- Tamanhos -->
      <div class="mb-3">
        <strong>Tamanho</strong><br />
        <button class="btn btn-outline-secondary size-btn">P</button>
        <button class="btn btn-outline-secondary size-btn">M</button>
        <button class="btn btn-outline-secondary size-btn">G</button>
        <button class="btn btn-outline-secondary size-btn">GG</button>
      </div>

      <!-- Cor -->
      <div class="mb-3">
        <strong>Cor</strong><br />
        <div class="color-box" style="background-color: #2f3d5c"></div>
        <span>Stone Blue</span>
      </div>

      <!-- Botão de Compra -->
      <button class="btn btn-secondary out-of-stock w-100 mt-3" disabled>
        ESGOTADO
      </button>

      <!-- Tabela de medidas -->
      <button class="btn btn-link mt-3 text-muted p-0" onclick="toggleTabela()">
        Abrir Tabela de medidas
      </button>

      <div id="tabelaMedidas" class="tabela-container mt-3">
        <img
          src="{% static 'main_app/img/logo.png' %}"
          alt="Tabela de Medidas"
          class="img-fluid"
        />
      </div>
    </div>
  </div>
</div>

<!-- Script toggle tabela -->
<script>
  function toggleTabela() {
    const tabela = document.getElementById("tabelaMedidas");
    tabela.classList.toggle("active");
  }
</script>

<!-- Bootstrap JS (necessário para o carrossel funcionar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
