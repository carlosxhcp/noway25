{% extends 'base.html' %}

{% block content %}
    <h1>Meu Perfil</h1>
    <p>Nome de usuário: {{ user.username }}</p>
    <p>Email: {{ user.email }}</p>
    <p>Primeiro Nome: {{ user.first_name }}</p>
    <p>Último Nome: {{ user.last_name }}</p>
    <a href="{% url 'account_logout' %}">Sair</a>
{% endblock %}
