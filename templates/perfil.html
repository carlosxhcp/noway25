{% extends 'base.html' %}

{% block content %}
<h1>Meu Perfil</h1>

<p>Nome: {{ user.username }}</p>
<p>Email: {{ user.email }}</p>

{% if user.profile.avatar %}
  <img src="{{ user.profile.avatar }}" alt="Avatar" style="width:150px; height:150px; border-radius:50%;">
{% else %}
  <p>Sem avatar ainda.</p>
{% endif %}

<a href="{% url 'account_logout' %}">Sair</a>
{% endblock %}
