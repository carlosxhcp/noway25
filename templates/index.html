{% load static %}

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Navbar com Logo Central</title>
  <link rel="stylesheet" href="{% static 'main_app/css/index.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-secondary">
    <div class="container-fluid">
      <a class="navbar-brand d-md-none" href="#">
        <img src="{% static "main_app/img/logo.png" %}" alt="">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Features</a>
          </li>
          <a class="navbar-brand d-none d-md-block" href="#">
            <img src="{% static "main_app/img/logo.png" %}" alt="">
          </a>
          <li class="nav-item">
            <a class="nav-link" href="#">Pricing</a>
          </li>
          <li class="nav-item">
            <a class="nav-link">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  
  <p class="mt-5 text-center">CUZINHO PRETO<a href="https://codingyaar.com/responsive-bootstrap-navbar-center-logo/" target="_blank">Bootstrap Navbar Center Logo</a> </p>
  
  <p class="mt-5 text-center">Get a step-by-step video explanation here: <a href="https://youtu.be/5hvZWpRFKmk" target="_blank">Bootstrap Navbar Center Logo</a> </p>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
