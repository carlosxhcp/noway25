{% extends "base.html" %}

{% load static %}



{% block title %}Noway. Shop{% endblock %}

{% block content %}
<style>
  
</style>

    <div class="mockup d-flex justify-content-center justify-content-md-around flex-wrap">

      {% load static %}

            <!-- Exemplo para a Imagem 1 -->
        <div class="container troca-imagem">
          <img src="{% static 'main_app/img/shop/mock1.png' %}" class="img-base" alt="Mockup 1">
          <img src="{% static 'main_app/img/shop/mock1b.png' %}" class="img-hover" alt="Mockup 1 Hover">
        </div>

        <!-- Exemplo para a Imagem 2 -->
        <div class="container troca-imagem">
          <img src="{% static 'main_app/img/shop/mock2.png' %}" class="img-base" alt="Mockup 2">
          <img src="{% static 'main_app/img/shop/mock2b.png' %}" class="img-hover" alt="Mockup 2 Hover">
        </div>


    </div>

    
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
    <script>
      document.querySelectorAll('.troca-imagem').forEach(container => {
        let touchStartX = null;
        let touchStartY = null;
    
        container.addEventListener('touchstart', e => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }, { passive: true });
    
        container.addEventListener('touchend', e => {
          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;
    
          const diffX = Math.abs(touchEndX - touchStartX);
          const diffY = Math.abs(touchEndY - touchStartY);
    
          if (diffX > 50 || diffY > 50) {
            // Adiciona a classe para mostrar imagem hover
            container.classList.add('scroll-ativa');
    
            // Espera 3 segundos e volta para a imagem original
            setTimeout(() => {
              container.classList.remove('scroll-ativa');
            }, 500); // 3000ms = 3 segundos
          }
        });
      });
    </script>
    
    {% endblock %}
