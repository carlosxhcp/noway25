<!DOCTYPE html>
{% load static %}

<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <link rel="stylesheet" href="{% static 'main_app/css/shop.css' %}" />
    <title>Galeria de Produtos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-image: url("{%static 'main_app/img/shop/background3.png'%}")
      }

      .product {
        text-align: center;
        margin-bottom: 30px;
      }

      .img-box {
        width: 100%;
        max-width: 450px;
        height: 450px;
        margin: 0 auto;
        background-size: cover;
        background-position: center;
      }

      /* Produto 1 */
      .produto-1 {
        background-image: url("{% static 'main_app/img/shop/mock1.png' %}");
      }

      .produto-1:hover {
        background-image: url("{% static 'main_app/img/shop/mock1b.png' %}");
      }

      /* Produto 2 */
      .produto-2 {
        background-image: url("{% static 'main_app/img/shop/mock2.png' %}");
      }

      .produto-2:hover {
        background-image: url("{% static 'main_app/img/shop/mock2b.png' %}");
      }

      /* Produto 3 */
      .produto-3 {
        background-image: url("{% static 'main_app/img/shop/mock3.png' %}");
      }

      .produto-3:hover {
        background-image: url("{% static 'main_app/img/shop/mock3b.png' %}");
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <h2 class="text-center mb-4">Produtos em Destaque</h2>
      <div class="row justify-content-center">
        <!-- Produto 1 -->
        <div class="col-12 col-sm-6 col-md-4 product">
          <div class="img-box produto-1"></div>
          <p class="mt-2"></p>
        </div>

        <!-- Produto 2 -->
        <div class="col-12 col-sm-6 col-md-4 product">
          <div class="img-box produto-2"></div>
          <p class="mt-2"></p>
        </div>

        <!-- Produto 3 -->
        <div class="col-12 col-sm-6 col-md-4 product">
          <div class="img-box produto-3"></div>
          <p class="mt-2"></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
